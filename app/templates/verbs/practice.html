{% extends "base.html" %}

{% block title %}Verb Practice{% endblock %}

{% block content %}
<div class="verbs-practice-page"
     data-infinitive-id="{{ context.infinitive_id }}"
     data-tense-id="{{ context.tense_id }}"
     data-progress-url="{{ url_for('api.verbs_api.save_progress') }}"
     data-next-url="{{ next_practice_url }}">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Verb Practice</h4>
        <a href="{{ url_for('verbs.index', tense_id=context.tense_id) }}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <p class="mb-1"><strong>Infinitive:</strong> {{ context.infinitive }}</p>
            <p class="mb-0"><strong>Tense:</strong> {{ context.tense }}</p>
        </div>
    </div>

    <div class="alert alert-light border mb-4">
        <span id="verbs-live-score">Score: 0/5</span>
    </div>

    <div class="verbs-practice-list">
        {% for person in person_order %}
        <div class="verbs-practice-row" data-person="{{ person }}">
            <button type="button"
                    class="btn btn-link p-0 verbs-person-btn"
                    data-person="{{ person }}">
                {{ person_labels[person] }}
            </button>
            <input
                id="form_{{ person }}"
                type="text"
                class="form-control verbs-answer-input"
                data-person="{{ person }}"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >
            <span class="verbs-row-check" data-person="{{ person }}" aria-hidden="true">✓</span>
        </div>
        {% endfor %}
    </div>

    <div class="verbs-practice-footer">
        <div class="small text-muted" id="verbs-footer-progress">0/5 correct</div>
        <button id="verbs-next-btn" type="button" class="btn btn-primary btn-lg d-none">Next</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script id="verbs-answers-data" type="application/json">{{ context.forms|tojson }}</script>
<script src="{{ url_for('static', filename='js/verbs_practice.js') }}"></script>
{% endblock %}
